      <circle r="3"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
    </g>

    <!-- title -->
    <text x="52" y="92" class="sans" font-size="46" font-weight="800" fill="url(#title)" textLength="352" lengthAdjust="spacing">Hi, I'm Anthony</text>
    <g transform="translate(446 74)">
      <text class="emoji" font-size="42" text-anchor="middle" dominant-baseline="central" x="0" y="0">👋
        <animateTransform attributeName="transform" type="rotate" dur="2.4s" repeatCount="indefinite"
          values="0 6 14;16 6 14;-8 6 14;16 6 14;-4 6 14;10 6 14;0 6 14;0 6 14"
          keyTimes="0;0.08;0.16;0.24;0.32;0.4;0.48;1"/>
      </text>
    </g>

    <!-- terminal line -->
    <text x="54" y="150" class="mono" font-size="20" font-weight="700" fill="#4ade80">$</text>
    <g class="mono" font-size="20" fill="#cbd5e1">
      <text x="80" y="150" textLength="481.6" lengthAdjust="spacingAndGlyphs" opacity="0">automating the house with Home Assistant<animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="16s" begin="0s" repeatCount="indefinite"/></text>
      <text x="80" y="150" textLength="288.96" lengthAdjust="spacingAndGlyphs" opacity="0">self-hosting with Docker<animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="16s" begin="4s" repeatCount="indefinite"/></text>
      <text x="80" y="150" textLength="409.36" lengthAdjust="spacingAndGlyphs" opacity="0">tinkering with networks, APIs + AI<animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="16s" begin="8s" repeatCount="indefinite"/></text>
      <text x="80" y="150" textLength="469.56" lengthAdjust="spacingAndGlyphs" opacity="0">building, breaking, figuring things out<animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="16s" begin="12s" repeatCount="indefinite"/></text>
    </g>
