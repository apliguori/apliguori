      <circle cx="660" cy="50" r="7"/>
      <circle cx="800" cy="45" r="6"/>
      <circle cx="812" cy="140" r="7"/>
      <circle cx="760" cy="180" r="6"/>
      <circle cx="665" cy="160" r="6"/>
    </g>
    <circle cx="730" cy="105" r="15" fill="#0e7490" stroke="#a5f3fc" stroke-width="2"/>
    <circle cx="730" cy="105" r="15" fill="none" stroke="#67e8f9" stroke-width="2">
      <animate attributeName="r" values="15;34" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- packets -->
    <g fill="#a5f3fc">
      <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="3.4s" begin="0.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
